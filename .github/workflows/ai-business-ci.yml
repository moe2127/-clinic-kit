name: AI business MVP checks
on:
  push:
    paths: ['ai-business/**', '.github/workflows/ai-business-ci.yml']
  pull_request:
    paths: ['ai-business/**', '.github/workflows/ai-business-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-business/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - run: npm ci
      - run: npm test
      - run: npm run build
